    <!-- ═══ PRELOADER STYLES (inline for instant render) ═══ -->
    <style id="preloader-styles">
      #preloader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #F8F9FA;
        transition: opacity 0.7s cubic-bezier(0.22, 1, 0.36, 1),
                    transform 0.7s cubic-bezier(0.22, 1, 0.36, 1),
                    visibility 0.7s cubic-bezier(0.22, 1, 0.36, 1);
      }
      #preloader.preloader-exit {
        opacity: 0;
        transform: scale(1.02);
        visibility: hidden;
        pointer-events: none;
      }

      /* ── Central content wrapper ── */
      .preloader-center {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      /* ── Logo container with spinner ── */
      .preloader-logo-wrap {
        position: relative;
        width: 180px;
        height: 180px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      @media (min-width: 640px) {
        .preloader-logo-wrap {
          width: 220px;
          height: 220px;
        }
      }
      @media (min-width: 1024px) {
        .preloader-logo-wrap {
          width: 250px;
          height: 250px;
        }
      }

      /* ── Logo image — large & crisp ── */
      .preloader-logo {
        width: 120px;
        height: 120px;
        object-fit: contain;
        animation: preloaderLogoEntrance 1.1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        filter: drop-shadow(0 8px 32px rgba(10, 25, 47, 0.12));
        position: relative;
        z-index: 2;
      }
      @media (min-width: 640px) {
        .preloader-logo {
          width: 150px;
          height: 150px;
          filter: drop-shadow(0 12px 40px rgba(10, 25, 47, 0.10));
        }
      }
      @media (min-width: 1024px) {
        .preloader-logo {
          width: 170px;
          height: 170px;
        }
      }

      /* ── Spinner ring (single, elegant, red) ── */
      .preloader-spinner {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 2px solid rgba(10, 25, 47, 0.06);
        border-top-color: #D90429;
        animation: preloaderSpin 1.6s cubic-bezier(0.55, 0.06, 0.68, 0.19) infinite;
        z-index: 1;
      }

      /* ── Outer decorative ring (static, very subtle) ── */
      .preloader-ring-outer {
        position: absolute;
        inset: -12px;
        border-radius: 50%;
        border: 1px solid rgba(10, 25, 47, 0.05);
        z-index: 0;
        animation: preloaderRingFade 1.2s ease-out 0.3s forwards;
        opacity: 0;
      }
      @media (min-width: 640px) {
        .preloader-ring-outer { inset: -16px; }
      }

      /* ── Brand text block ── */
      .preloader-brand {
        margin-top: 40px;
        text-align: center;
        animation: preloaderTextSlideUp 1s ease-out 0.4s forwards;
        opacity: 0;
        transform: translateY(12px);
      }
      @media (min-width: 640px) {
        .preloader-brand { margin-top: 48px; }
      }

      .preloader-brand-name {
        font-family: 'Inter', system-ui, sans-serif;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.34em;
        text-transform: uppercase;
        color: #0A192F;
      }
      @media (min-width: 640px) {
        .preloader-brand-name { font-size: 11px; letter-spacing: 0.38em; }
      }

      .preloader-tagline {
        margin-top: 8px;
        font-family: 'Playfair Display', Georgia, serif;
        font-size: 13px;
        font-style: italic;
        font-weight: 400;
        color: rgba(10, 25, 47, 0.40);
        letter-spacing: 0.02em;
      }
      @media (min-width: 640px) {
        .preloader-tagline { font-size: 15px; margin-top: 10px; }
      }

      /* ── Thin separator line between logo and text ── */
      .preloader-divider {
        width: 32px;
        height: 1px;
        background: rgba(10, 25, 47, 0.12);
        margin-top: 32px;
        animation: preloaderDividerExpand 0.8s ease-out 0.6s forwards;
        transform: scaleX(0);
      }
      @media (min-width: 640px) {
        .preloader-divider { width: 40px; margin-top: 38px; }
      }

      /* ── Progress line at bottom ── */
      .preloader-progress {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 2px;
        background: rgba(10, 25, 47, 0.04);
      }
      .preloader-progress-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #D90429, #D90429);
        animation: preloaderProgressFill 2.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }

      /* ── Keyframes ── */
      @keyframes preloaderLogoEntrance {
        0% { opacity: 0; transform: scale(0.8) translateY(8px); }
        100% { opacity: 1; transform: scale(1) translateY(0); }
      }
      @keyframes preloaderSpin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes preloaderRingFade {
        to { opacity: 1; }
      }
      @keyframes preloaderTextSlideUp {
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes preloaderDividerExpand {
        to { transform: scaleX(1); }
      }
      @keyframes preloaderProgressFill {
        0% { width: 0%; }
        50% { width: 65%; }
        100% { width: 100%; }
      }
    </style>
